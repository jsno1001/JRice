#
# ~/.config/hypr/hyprlock.conf
#
# Базовый конфиг hyprlock: размытый фон, часы, дата, поле ввода пароля.
# Документация: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/
#

general {
    disable_loading_bar = true
    grace = 2
    hide_cursor = true
    no_fade_in = false

    # Поддержка отпечатка пальца (требует настроенный fprintd: пакет fprintd + fprintd-enroll)
    # Работает параллельно с паролем — просто прикладываешь палец, без Enter.
    # Для версий hyprlock < 0.6.0 используйте ключи ниже (внутри general):
    # fingerprint_ready_message = Приложите палец к сканеру
    # fingerprint_present_message = Сканирование...
}

# Для версий hyprlock >= 0.6.0 — отдельный блок fingerprint (раскомментируйте при необходимости):
fingerprint {
    enabled = true
    ready_message = Приложите палец к сканеру
    present_message = Сканирование...
    retry_delay = 250
}

background {
    monitor =
    path = screenshot          # можно заменить на путь к своей картинке, например: ~/Pictures/wall.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <i>Введите пароль...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

# Часы
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}

# Имя пользователя
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.9)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}

auth {
    fingerprint {
        enabled = true
        ready_message = Приложите палец
    }
    pam {
        enabled = true
    }
}
